# Категории свидетелства за управление на МПС (чл. 150а от Закона за движението по пътищата).
# minAge — минимална възраст по общото правило (без изключенията). Проверявайте актуалния текст на закона.
- code: AM
  name: "Мопеди и леки четириколки"
  description: "Двуколесни и триколесни мопеди и леки четириколки с максимална конструктивна скорост до 45 km/h."
  minAge: 16
- code: A1
  name: "Леки мотоциклети"
  description: "Мотоциклети с работен обем до 125 cm³ и мощност до 11 kW, както и мототриколки до 15 kW."
  minAge: 16
- code: A2
  name: "Мотоциклети до 35 kW"
  description: "Мотоциклети с мощност до 35 kW."
  minAge: 18
- code: A
  name: "Мотоциклети"
  description: "Всички мотоциклети и мототриколки."
  minAge: 24
- code: B1
  name: "Четириколки"
  description: "Четириколки (без леките четириколки от категория AM)."
  minAge: 16
- code: B
  name: "Леки автомобили"
  description: "Автомобили с допустима максимална маса до 3500 kg и до 8 места за пътници освен мястото на водача; може с лек ремарке."
  minAge: 18
- code: BE
  name: "Лек автомобил с ремарке"
  description: "Състав от автомобил от категория B и ремарке с допустима максимална маса до 3500 kg."
  minAge: 18
- code: C1
  name: "Товарни автомобили до 7500 kg"
  description: "Автомобили с допустима максимална маса над 3500 kg, но не повече от 7500 kg."
  minAge: 18
- code: C1E
  name: "C1 с ремарке"
  description: "Състав от автомобил от категория C1 и ремарке над 750 kg (при ограничения в общата маса)."
  minAge: 18
- code: C
  name: "Товарни автомобили"
  description: "Автомобили с допустима максимална маса над 3500 kg."
  minAge: 21
- code: CE
  name: "Товарен автомобил с ремарке"
  description: "Състав от автомобил от категория C и ремарке над 750 kg."
  minAge: 21
- code: D1
  name: "Микробуси"
  description: "Автомобили за превоз на пътници с до 16 места освен мястото на водача и дължина до 8 m."
  minAge: 21
- code: D1E
  name: "D1 с ремарке"
  description: "Състав от автомобил от категория D1 и ремарке над 750 kg."
  minAge: 21
- code: D
  name: "Автобуси"
  description: "Автомобили за превоз на повече от 8 пътници освен мястото на водача."
  minAge: 24
- code: DE
  name: "Автобус с ремарке"
  description: "Състав от автомобил от категория D и ремарке над 750 kg."
  minAge: 24
- code: Ткт
  name: "Колесни трактори"
  description: "Колесни трактори и самоходни машини (по реда на наредбата)."
- code: Ттб
  name: "Тролейбуси"
  description: "Тролейбуси."
- code: Ттм
  name: "Трамваи"
  description: "Трамваи."
